schema_version: "1.0"
experiment: "wesad_wrist_binary_stress_loso"
input: "data/processed/wesad/windows.parquet"
source_manifest: "data/processed/wesad/manifest.json"
seed: 1337
window_seconds: [30, 60, 120]
models: [rf, xgboost]
outer_split: "leave_one_subject_out"
calibration_subjects_per_fold: 3
calibration_methods: [raw, platt, isotonic]
decision_threshold: 0.5
experimental_abstain_margin: 0.1
ece_bins: 10
calibration_logistic_c: 10000
rf:
  n_estimators: 300
  min_samples_leaf: 3
  class_weight: balanced_subsample
  n_jobs: 4
xgboost:
  n_estimators: 300
  max_depth: 3
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  n_jobs: 4
